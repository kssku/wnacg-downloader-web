[package]
name = "wnacg-server"
version = "0.1.0"
description = "Web control panel for wnacg downloader (NAS / Docker)"
authors = ["you"]
edition = "2021"

[[bin]]
name = "wnacg-server"
path = "src/main.rs"

[lib]
name = "wnacg_server"
path = "src/lib.rs"

[dependencies]
# ── 核心逻辑（与原桌面版保持一致，只去掉 Tauri）────────────────
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1" }
yaserde = { version = "0.12.0", features = ["yaserde_derive"] }

reqwest = { version = "0.12.12", features = ["rustls-tls", "cookies"], default-features = false }
reqwest-retry = { version = "0.7.0" }
reqwest-middleware = { version = "0.4.0" }

anyhow = { version = "1.0.96" }
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1.43.0", features = ["full"] }
bytes = { version = "1.10.1" }
parking_lot = { version = "0.12.3", features = ["send_guard"] }
rayon = { version = "1.11.0" }
scraper = { version = "0.23.1" }
image = { version = "0.25.5", default-features = false, features = ["jpeg", "png", "webp"] }
lopdf = { git = "https://github.com/lanyeeee/lopdf", features = ["embed_image_jpeg", "embed_image_png", "embed_image_webp"] }
uuid = { version = "1.15.1", features = ["v4"] }
zip = { version = "2.2.3", default-features = false }
strfmt = { version = "0.2.5" }

tracing = { version = "0.1.41" }
tracing-subscriber = { version = "0.3.19", features = ["json", "time", "local-time"] }
tracing-appender = { version = "0.2.3" }
notify = { version = "8.0.0" }

# ── Web 层（新增）──────────────────────────────────────────
axum = { version = "0.7", features = ["ws"] }
tower = { version = "0.5" }
tower-http = { version = "0.5", features = ["fs", "trace", "cors"] }
futures-util = { version = "0.3" }

# ── 认证（新增）────────────────────────────────────────────
base64 = { version = "0.22" }
rand = { version = "0.8" }

# ── 持久化（新增）──────────────────────────────────────────
rusqlite = { version = "0.32", features = ["bundled"] }
walkdir = { version = "2.5" }

[profile.release]
strip = true
lto = true
codegen-units = 1
